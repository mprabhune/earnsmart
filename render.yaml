services:
  - type: web
    name: earnsmart-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Supabase PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
